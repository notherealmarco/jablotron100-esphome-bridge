# jablo2esphome configuration
#
# The bridge exposes your Jablotron 100 alarm system to Home Assistant as if it
# were a native ESPHome device: the HA "ESPHome" integration discovers it on
# port 6053 (or you can add it manually by IP).

# Name shown in Home Assistant (device name).
name: Jablotron

# USB device with the Jablotron USB adapter.
#   auto      -> autodetect /dev/hidraw* by vendor/product ID (default)
#   /dev/...  -> fixed device path (e.g. a udev symlink, or /dev/jablotron in Docker)
serial_port: auto

# Master/installer code of the alarm system. Required to arm/disarm and for the
# "wrong code" login event. Mind that the panel accepts only digits and the "*"
# wildcard, 4-10 characters. It is checked against packets, not transmitted.
alarm_password: "1234"

# Optional stable unique id. Used to derive the ESPHome device MAC address so it
# never changes across restarts. Defaults to the serial port when omitted.
unique_id: jablotron-home

# How many devices can the central unit hold? (1-230, default 70)
number_of_devices: 70

# Device types, indexed by device number 1..number_of_devices, in the same
# order as shown in the J-Link/F-Link/mobile app (ignore the central unit at
# position 0). The panel does not broadcast device types, so this list is
# required: devices left as "empty" produce no entities. Valid types:
#   motion_detector, window_opening_detector, door_opening_detector,
#   garage_door_opening_detector, glass_break_detector, smoke_detector,
#   flood_detector, gas_detector, keypad, keypad_with_door_opening_detector,
#   indoor_siren, outdoor_siren, lock, tamper, button, key_fob, thermostat,
#   thermometer, electricity_meter_with_pulse_output, radio_module, valve,
#   custom, other, empty
devices: []

# Number of programmable outputs (0-128). Configured on the panel.
number_of_pg_outputs: 0

# Alarm panel behaviour (the bridge's "options").
require_code_to_arm: false
require_code_to_disarm: true
# Controls how the section's "partially armed" state is reported, and which
# arming modes Home Assistant offers on the alarm panel entity:
#   night_mode     -> Arm away + Arm night
#   home_mode      -> Arm away + Arm home
#   not_supported  -> Arm away only
partially_arming_mode: night_mode
enable_debugging: false
log_all_incoming_packets: false
log_all_outcoming_packets: false
log_sections_packets: false
log_pg_outputs_packets: false
log_devices_packets: false

# --- ESPHome native API server --------------------------------------------
# Plaintext transport, no password and no encryption key (the current ESPHome
# default; legacy password auth was removed in ESPHome 2026.1). Home Assistant
# adds the device with no key prompt. Full Noise encryption is future work.
api_port: 6053

# Where the bridge stores persisted state (HVAC state, detected devices).
#store_dir: ./data