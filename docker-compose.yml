services:
  jablo2esphome:
    image: ghcr.io/notherealmarco/jablotron100-esphome-bridge:latest
    # Use this as a fallback if ghrc does not work for you
    #image: git.marcorealacci.me/marcorealacci/jablotron100-esphome-bridge:latest
    container_name: jablo2esphome
    restart: unless-stopped
    # Pass the Jablotron USB adapter into the container. Create a stable udev
    # symlink so the number does not matter:
    #   /etc/udev/rules.d/99-jablotron.rules:
    #     SUBSYSTEM=="hidraw", ATTRS{idVendor}=="16d6", ATTRS{idProduct}=="0008", SYMLINK+="jablotron", MODE="0660", GROUP="plugdev"
    devices:
      - "/dev/jablotron:/dev/jablotron"
    ports:
      - "6053:6053/tcp"
      - "6053:6053/udp"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - jablo2esphome_data:/app/data

volumes:
  jablo2esphome_data: